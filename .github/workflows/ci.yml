name: Проверки и образ Retro
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: retro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Go
        run: |
          go test -race ./...
          go vet ./...
      - name: Браузерные регрессии
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run test:integration
      - name: Инструменты и контейнер
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
          docker build --pull -t retro:ci .
          docker create --name retro-ci-caddy caddy:2.11.9-alpine
          docker cp retro-ci-caddy:/usr/bin/caddy /tmp/retro-ci-caddy
          docker rm retro-ci-caddy
          go build -o /tmp/retro-ci .
      - name: Эксплуатация, HTTPS, вход, SSE и восстановление
        env:
          RETRO_TEST_BINARY: /tmp/retro-ci
          CADDY_TEST_BINARY: /tmp/retro-ci-caddy
          RETRO_CONTAINER_SMOKE: '1'
        run: |
          python3 -m unittest discover -s tests/ops -v
          python3 -m unittest discover -s tests/deployment -v
          python3 tests/deployment/container_smoke.py

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Опубликовать версию и тег коммита
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --pull -t "$image:$GITHUB_REF_NAME" -t "$image:sha-$GITHUB_SHA" .
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:sha-$GITHUB_SHA"
